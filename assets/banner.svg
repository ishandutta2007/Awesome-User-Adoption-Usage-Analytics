<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.08); opacity: 0.6; }
      100% { transform: scale(1); opacity: 0.3; }
    }
    @keyframes floatChart {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
    .pulse-bg { animation: pulse 6s infinite ease-in-out; transform-origin: center; }
    .chart-float { animation: floatChart 4s infinite ease-in-out; transform-origin: center; }
    .anim-line { stroke-dasharray: 10, 10; animation: dash 5s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGradient)"/>

  <!-- Animated Glowing Background Orbs (Behind content) -->
  <circle cx="200" cy="100" r="180" fill="#38bdf8" class="pulse-bg" filter="url(#glow)" opacity="0.15"/>
  <circle cx="1000" cy="300" r="220" fill="#c084fc" class="pulse-bg" filter="url(#glow)" opacity="0.15"/>

  <!-- Dynamic Tech UI Graphics (Background Elements) -->
  <g class="chart-float" opacity="0.35">
    <!-- Animated Chart Grid -->
    <path d="M 800 320 L 1120 320 M 800 260 L 1120 260 M 800 200 L 1120 200 M 800 140 L 1120 140" stroke="#475569" stroke-width="1" stroke-dasharray="4,4"/>
    
    <!-- Flow Graph Nodes -->
    <path d="M 820 280 Q 900 240 960 170 T 1100 120" fill="none" stroke="url(#textGradient)" stroke-width="4" filter="url(#glow)"/>
    <path d="M 820 280 Q 900 240 960 170 T 1100 120" fill="none" stroke="#ffffff" stroke-width="2" class="anim-line"/>

    <circle cx="820" cy="280" r="7" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="960" cy="170" r="7" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="1100" cy="120" r="7" fill="#c084fc" filter="url(#glow)"/>
    
    <!-- Floating Analytics Cards / Pills in background -->
    <rect x="780" y="60" width="130" height="40" rx="8" fill="url(#accentGradient)" stroke="#38bdf8" stroke-width="1"/>
    <text x="845" y="85" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📈 Adoption +142%</text>

    <rect x="980" y="240" width="140" height="45" rx="8" fill="url(#accentGradient)" stroke="#c084fc" stroke-width="1"/>
    <text x="1050" y="267" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Active Users</text>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(80, 0)">
    <!-- Top Badge Header -->
    <rect x="0" y="70" width="280" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="140" y="91" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">AWESOME ECOSYSTEM LIST</text>

    <!-- Main Title -->
    <text x="0" y="170" fill="url(#textGradient)" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1" filter="url(#glow)">
      User Adoption &amp;
    </text>
    <text x="0" y="235" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
      Usage Analytics
    </text>

    <!-- Subtitle -->
    <text x="0" y="295" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      Curated Product Analytics, DAP Engines, Guidance &amp; Open-Source Tools
    </text>

    <!-- Subtitle Tagline Pills -->
    <g transform="translate(0, 325)">
      <rect x="0" y="0" width="160" height="30" rx="15" fill="#334155" opacity="0.8"/>
      <text x="80" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🚀 Product Growth</text>

      <rect x="175" y="0" width="160" height="30" rx="15" fill="#334155" opacity="0.8"/>
      <text x="255" y="20" fill="#818cf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">💡 In-App Guidance</text>

      <rect x="350" y="0" width="170" height="30" rx="15" fill="#334155" opacity="0.8"/>
      <text x="435" y="20" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔓 Open-Source First</text>
    </g>
  </g>
</svg>
